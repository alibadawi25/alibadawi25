<svg width="900" height="200" viewBox="0 0 900 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="dots" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1" fill="#141414"/>
    </pattern>
    <style>
      @keyframes blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      .cur { animation: blink 1.1s infinite; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="900" height="200" fill="#000000"/>
  <!-- Dot grid -->
  <rect width="900" height="200" fill="url(#dots)"/>

  <!-- Border hairlines -->
  <line x1="0" y1="0" x2="900" y2="0" stroke="#1f1f1f" stroke-width="1"/>
  <line x1="0" y1="199" x2="900" y2="199" stroke="#1f1f1f" stroke-width="1"/>

  <!-- Corner brackets — TL -->
  <polyline points="18,52 18,18 52,18" stroke="#2c2c2c" stroke-width="1.5" fill="none" stroke-linecap="square"/>
  <!-- Corner brackets — TR -->
  <polyline points="848,18 882,18 882,52" stroke="#2c2c2c" stroke-width="1.5" fill="none" stroke-linecap="square"/>
  <!-- Corner brackets — BL -->
  <polyline points="52,182 18,182 18,148" stroke="#2c2c2c" stroke-width="1.5" fill="none" stroke-linecap="square"/>
  <!-- Corner brackets — BR -->
  <polyline points="848,182 882,182 882,148" stroke="#2c2c2c" stroke-width="1.5" fill="none" stroke-linecap="square"/>

  <!-- Path label -->
  <text x="30" y="38" font-family="'Courier New', monospace" font-size="10" fill="#262626" letter-spacing="1">~/alibadawi25 $</text>

  <!-- Name -->
  <text x="450" y="97" font-family="'Courier New', monospace" font-size="68" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="middle" letter-spacing="-2">Ali Badawi</text>
  <!-- Blinking cursor -->
  <text x="650" y="97" font-family="'Courier New', monospace" font-size="68" font-weight="700" fill="#ffffff" text-anchor="start" dominant-baseline="middle" class="cur">_</text>

  <!-- Separator -->
  <line x1="310" y1="130" x2="590" y2="130" stroke="#1a1a1a" stroke-width="1"/>

  <!-- Subtitle -->
  <text x="450" y="159" font-family="'Courier New', monospace" font-size="11" fill="#404040" text-anchor="middle" letter-spacing="5">CS STUDENT · FULL-STACK DEV · GAME DEV</text>
</svg>
